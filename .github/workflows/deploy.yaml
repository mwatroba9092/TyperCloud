name: TyperCloud CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/mwatroba9092/typercloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci backendu
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testow (pytest)
        working-directory: services/backend
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do rejestru (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push obrazu (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:dev
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja kubectl
        uses: azure/setup-kubectl@v4

      - name: Wczytanie kubeconfig z sekretu
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Wdrozenie manifestow (Kustomize, overlay dev)
        run: kubectl apply -k k8s/overlays/dev

      - name: Weryfikacja rolloutu backendu
        run: kubectl rollout status deployment/backend -n typercloud-dev --timeout=90s

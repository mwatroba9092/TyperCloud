name: TyperCloud CI/CD

# Uruchamia sie po kazdym push na galaz main.
on:
  push:
    branches: [main]

# ----------------------------------------------------------------------------
# PLACEHOLDERY DO PODMIANY:
#   REGISTRY        - rejestr obrazow (domyslnie GitHub Container Registry)
#   IMAGE_NAMESPACE - <owner>/<repo>, np. ghcr.io/jankowalski/typercloud
# Sekrety repozytorium (Settings -> Secrets and variables -> Actions):
#   KUBE_CONFIG     - zawartosc pliku kubeconfig (base64 lub raw) do dostepu do klastra
# ----------------------------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/OWNER/REPO   # <-- PODMIEN na swoj owner/repo

jobs:
  # 1) Proste testy jednostkowe backendu (pytest).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci backendu
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testow (pytest)
        working-directory: services/backend
        run: pytest -v

  # 2) Budowa i publikacja obrazow (frontend, backend, worker) do GHCR.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do rejestru (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push obrazu (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:dev
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

  # 3) Wdrozenie na klaster Kubernetes (overlay dev) + weryfikacja rolloutu.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja kubectl
        uses: azure/setup-kubectl@v4

      - name: Wczytanie kubeconfig z sekretu
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Wdrozenie manifestow (Kustomize, overlay dev)
        run: kubectl apply -k k8s/overlays/dev

      - name: Weryfikacja rolloutu backendu
        run: kubectl rollout status deployment/backend -n typercloud-dev --timeout=90s

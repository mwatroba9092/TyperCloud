name: TyperCloud CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/mwatroba9092/typercloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci backendu
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testow (pytest)
        working-directory: services/backend
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do rejestru (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push obrazu (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:dev
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja kubectl
        uses: azure/setup-kubectl@v4

      - name: Wczytanie kubeconfig z sekretu
        run: |
          mkdir -p $HOME/.kube
          KUBE_CONFIG_SECRET="${{ secrets.KUBE_CONFIG }}"
          if [ -z "$KUBE_CONFIG_SECRET" ]; then
            echo "::error::Sekret KUBE_CONFIG jest pusty."
            exit 1
          fi

          TMP_KUBECONFIG=$(mktemp)
          TMP_KUBECONFIG_NORMALIZED=$(mktemp)
          parse_mode=""

          validate_kubeconfig() {
            KUBECONFIG="$1" kubectl config view >/dev/null 2>&1
          }

          normalize_escaped_newlines() {
            perl -pe 's/\\r//g; s/\\n/\n/g' "$1" > "$2"
          }

          if printf '%s' "$KUBE_CONFIG_SECRET" | base64 --decode > "$TMP_KUBECONFIG" 2>/dev/null; then
            if validate_kubeconfig "$TMP_KUBECONFIG"; then
              parse_mode="base64"
            elif normalize_escaped_newlines "$TMP_KUBECONFIG" "$TMP_KUBECONFIG_NORMALIZED" \
              && validate_kubeconfig "$TMP_KUBECONFIG_NORMALIZED"; then
              mv "$TMP_KUBECONFIG_NORMALIZED" "$TMP_KUBECONFIG"
              parse_mode="base64-escaped"
            fi
          fi

          if [ -z "$parse_mode" ]; then
            printf '%s' "$KUBE_CONFIG_SECRET" > "$TMP_KUBECONFIG"
            if validate_kubeconfig "$TMP_KUBECONFIG"; then
              parse_mode="plain"
            elif normalize_escaped_newlines "$TMP_KUBECONFIG" "$TMP_KUBECONFIG_NORMALIZED" \
              && validate_kubeconfig "$TMP_KUBECONFIG_NORMALIZED"; then
              mv "$TMP_KUBECONFIG_NORMALIZED" "$TMP_KUBECONFIG"
              parse_mode="plain-escaped"
            fi
          fi

          if [ -z "$parse_mode" ]; then
            echo "::error::Sekret KUBE_CONFIG nie zawiera poprawnego kubeconfig."
            exit 1
          fi

          rm -f "$TMP_KUBECONFIG_NORMALIZED"
          mv "$TMP_KUBECONFIG" $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "Uzyto kubeconfig (${parse_mode})."

      - name: Wdrozenie manifestow (Kustomize, overlay dev)
        run: kubectl apply -k k8s/overlays/dev

      - name: Wymuszenie pobrania nowych obrazow przez K8s
        run: |
          kubectl rollout restart deployment backend frontend worker -n typercloud-dev

      - name: Weryfikacja rolloutu backendu
        run: kubectl rollout status deployment/backend -n typercloud-dev --timeout=90s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Srodowisko DEV - osobny namespace, mniejsze limity zasobow.
namespace: typercloud-dev

resources:
  - ../../base

patches:
  - path: patch-replicas.yaml

# Tagi obrazow specyficzne dla DEV (CI podstawia konkretny SHA).
images:
  - name: typercloud/backend
    newTag: dev
  - name: typercloud/frontend
    newTag: dev
  - name: typercloud/worker
    newTag: dev

apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: db-migrate
          image: typercloud/backend:latest
          command:
            - "sh"
            - "-c"
            - "until python -m app.init_db; do echo 'czekam na baze...'; sleep 2; done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: typercloud-secret
                  key: DATABASE_URL
      containers:
        - name: backend
          image: typercloud/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: typercloud-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: typercloud-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
